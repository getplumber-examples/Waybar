name: clang-format

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: RafikFarhad/clang-format-github-action@40f11200e893c5e48dee28fbfe3da60d6862418d # v6
        name: clang-format
        with:
          sources: "src/**/*.hpp,src/**/*.cpp"
          style: "file"
    permissions:
      contents: read
